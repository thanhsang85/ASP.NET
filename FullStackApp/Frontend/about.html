<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Giới thiệu - MyApi Shop</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/site.css" rel="stylesheet">
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="container py-5">
  <h1 id="aboutTitle">Đang tải...</h1>
  <p id="aboutContent" class="lead"></p>
  <h4 class="mt-4">Công nghệ sử dụng</h4>
  <ul id="techList"></ul>
</div>

<footer>&copy; 2026 MyApi Shop</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  renderNavbar("about");

  apiFetch("/info/about")
    .then(data => {
      document.getElementById("aboutTitle").textContent = data.title;
      document.getElementById("aboutContent").textContent = data.content;
      document.getElementById("techList").innerHTML = data.technologies.map(t => `<li>${t}</li>`).join("");
    })
    .catch(err => {
      document.getElementById("aboutTitle").textContent = "Không thể tải dữ liệu";
      document.getElementById("aboutContent").textContent = err.message;
    });
</script>
</body>
</html>
