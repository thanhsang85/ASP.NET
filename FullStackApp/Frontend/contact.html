<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liên hệ - MyApi Shop</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/site.css" rel="stylesheet">
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="container py-5" style="max-width:600px;">
  <h1 class="mb-4">Liên hệ với chúng tôi</h1>
  <div id="alertBox"></div>

  <form id="contactForm">
    <div class="mb-3">
      <label class="form-label">Họ và tên</label>
      <input type="text" class="form-control" id="name" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" id="email" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Nội dung</label>
      <textarea class="form-control" id="message" rows="5" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Gửi liên hệ</button>
  </form>
</div>

<footer>&copy; 2026 MyApi Shop</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  renderNavbar("contact");

  document.getElementById("contactForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const dto = {
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      message: document.getElementById("message").value,
    };
    try {
      const res = await apiFetch("/contact", { method: "POST", body: JSON.stringify(dto) });
      showAlert("alertBox", res.message, "success");
      document.getElementById("contactForm").reset();
    } catch (err) {
      showAlert("alertBox", err.message, "danger");
    }
  });
</script>
</body>
</html>
