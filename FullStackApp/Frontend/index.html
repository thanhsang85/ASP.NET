<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trang chủ - MyApi Shop</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/site.css" rel="stylesheet">
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="container py-5">
  <div class="hero">
    <h1 id="homeTitle">Đang tải...</h1>
    <p id="homeSubtitle" class="lead"></p>
    <a href="products.html" class="btn btn-light btn-lg">Xem sản phẩm</a>
  </div>

  <div class="row" id="highlightsRow"></div>
</div>

<footer>&copy; 2026 MyApi Shop</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  renderNavbar("home");

  apiFetch("/info/home")
    .then(data => {
      document.getElementById("homeTitle").textContent = data.title;
      document.getElementById("homeSubtitle").textContent = data.subtitle;
      const row = document.getElementById("highlightsRow");
      row.innerHTML = data.highlights.map(h => `
        <div class="col-md-4 mb-3">
          <div class="card h-100 shadow-sm">
            <div class="card-body">${h}</div>
          </div>
        </div>
      `).join("");
    })
    .catch(err => {
      document.getElementById("homeTitle").textContent = "Không thể tải dữ liệu";
      document.getElementById("homeSubtitle").textContent = err.message + " — kiểm tra API đã chạy chưa (xem README).";
    });
</script>
</body>
</html>
