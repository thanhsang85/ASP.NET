<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Đăng nhập - MyApi Shop</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/site.css" rel="stylesheet">
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="container py-5 d-flex justify-content-center">
  <div class="card shadow-sm" style="max-width:420px; width:100%;">
    <div class="card-body p-4">
      <h1 class="h3 mb-4 text-center">Đăng nhập</h1>
      <div id="alertBox"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Mật khẩu</label>
          <input type="password" class="form-control" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
      </form>
      <p class="text-center mt-3">Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></p>
    </div>
  </div>
</div>

<footer>&copy; 2026 MyApi Shop</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  renderNavbar("login");

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const dto = {
      email: document.getElementById("email").value,
      password: document.getElementById("password").value
    };
    try {
      const data = await apiFetch("/auth/login", { method: "POST", body: JSON.stringify(dto) });
      Auth.setSession(data.token, { email: data.email, fullName: data.fullName });
      window.location.href = "index.html";
    } catch (err) {
      showAlert("alertBox", err.message);
    }
  });
</script>
</body>
</html>
