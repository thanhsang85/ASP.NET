<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sản phẩm - MyApi Shop</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/site.css" rel="stylesheet">
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="container py-5">
  <h1 class="mb-4">Danh sách sản phẩm</h1>
  <div id="alertBox"></div>
  <div class="row" id="productGrid">
    <p>Đang tải sản phẩm...</p>
  </div>
</div>

<footer>&copy; 2026 MyApi Shop</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  renderNavbar("products");

  apiFetch("/products")
    .then(products => {
      const grid = document.getElementById("productGrid");
      if (products.length === 0) {
        grid.innerHTML = "<p>Chưa có sản phẩm nào.</p>";
        return;
      }
      grid.innerHTML = products.map(p => `
        <div class="col-md-3 mb-4">
          <div class="card product-card h-100 shadow-sm">
            <img src="${p.imageUrl || 'https://placehold.co/400x300?text=No+Image'}" class="card-img-top" alt="${p.name}">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">${p.name}</h5>
              <p class="card-text text-muted small">${p.description || ""}</p>
              <p class="fw-bold text-primary mt-auto">${Number(p.price).toLocaleString("vi-VN")} đ</p>
            </div>
          </div>
        </div>
      `).join("");
    })
    .catch(err => showAlert("alertBox", "Lỗi tải sản phẩm: " + err.message));
</script>
</body>
</html>
