<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Đăng ký - MyApi Shop</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/site.css" rel="stylesheet">
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="container py-5 d-flex justify-content-center">
  <div class="card shadow-sm" style="max-width:450px; width:100%;">
    <div class="card-body p-4">
      <h1 class="h3 mb-4 text-center">Đăng ký tài khoản</h1>
      <div id="alertBox"></div>

      <form id="registerForm">
        <div class="mb-3">
          <label class="form-label">Họ và tên</label>
          <input type="text" class="form-control" id="fullName" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Mật khẩu</label>
          <input type="password" class="form-control" id="password" minlength="6" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Xác nhận mật khẩu</label>
          <input type="password" class="form-control" id="confirmPassword" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Đăng ký</button>
      </form>
      <p class="text-center mt-3">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
    </div>
  </div>
</div>

<footer>&copy; 2026 MyApi Shop</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  renderNavbar("register");

  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
      showAlert("alertBox", "Mật khẩu xác nhận không khớp.");
      return;
    }

    const dto = {
      fullName: document.getElementById("fullName").value,
      email: document.getElementById("email").value,
      password
    };

    try {
      const data = await apiFetch("/auth/register", { method: "POST", body: JSON.stringify(dto) });
      Auth.setSession(data.token, { email: data.email, fullName: data.fullName });
      window.location.href = "index.html";
    } catch (err) {
      showAlert("alertBox", err.message);
    }
  });
</script>
</body>
</html>
